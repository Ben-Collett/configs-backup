[general]
auto_append = false
buffer_size = -1

[ipc]
ipc_enabled_commands = [
  "mc",  # activate normal casing
  "sc",  # activate snake_casing
  "pm",  # activate ProperCasing
  "cm",  # activate camelCasing
  "us",  # activate UPPER_SNAKE_CASING
  "cb",  # clear buffer
  "sm",  # set main buffer
  "sr",  # set right buffer
  # "rl",  # reload config
  # "rs",  # restart program
]

[linux]
keyboard_type = "grab"

[on_press]
space = "expand"
# enter = "expand" # expand when you preess enter/return, annoying for coding.
# "shift+space" = "expand" # expand when you press shift+space, that way it is harder to accidentally expand
"shift+backspace" = "delete_word"
"menu" = "delete_word"
# these two should probably always be set to this
up = "clear_buffer_ipc_safe"
down = "clear_buffer_ipc_safe"

[chunking]
chunking_type = "last"
new_chunks_only = true

[code]
spacing_type = "new"
assumed_casing = "normal"
space_on_new = false

[while_down]
windows = "clear_buffer"
ctrl = "clear_buffer"

[chips]
"rl" = ["reload_config"]
"-" = ["kebab-case-mode"]
# "nm" = ["normal case mode"]
"_" = ["snake_case_mode"]
"__" = ["UPPER_SNAKE_CASE_MODE"]
".." = ["backspace", ".", ".", ".", "space"]
"pm" = ["ProperCaseMode"]
"cmm" = ["camelCaseMode"]
"restr" = ["restart"]
"'s" = ["backspace", "'", "s", "space"]
"'t" = ["backspace", "n", "'", "t", "space"]
"'l" = ["backspace", "'", "l", "l", "space"]
"'d" = ["backspace", "'", "d", "space"]
